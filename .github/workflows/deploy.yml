name: Test and deploy wblog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          WBLOG_SITE_DIR: template
      - run: npm run wblog -- doctor
        env:
          WBLOG_OFFLINE: "1"
          WBLOG_SITE_DIR: template
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          WBLOG_SITE_DIR: template
      - run: npm run build
        env:
          WBLOG_SITE_DIR: template
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      - run: npm run lighthouse
        env:
          WBLOG_SITE_DIR: template
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    if: ${{ vars.WBLOG_DEPLOY_PROJECT_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
